name: PHP master (advisory)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: php-master-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-master:
    name: PHP 8.7 (master, advisory)
    runs-on: ubuntu-latest
    # php-src master changes without notice; a failure here is an early
    # warning, not a merge gate.
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@3c21e10268bafaf84c59e8f4e65b39acacb62ca4 # main # zizmor: ignore[stale-action-refs,ref-version-mismatch]
        with:
          php-version: '8.7'
          tools: phpize, php-config
          coverage: none

      - name: Show PHP version
        run: php -v

      - name: Build extension
        run: |
          phpize
          ./configure --enable-lchash
          make -j"$(nproc)"

      - name: Run test suite
        env:
          NO_INTERACTION: 1
        run: |
          TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_EXECUTABLE
          TEST_PHP_ARGS="-d extension=$(pwd)/modules/lchash.so"
          export TEST_PHP_ARGS
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/

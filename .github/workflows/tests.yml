name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - run: composer validate --strict

  pie-smoke:
    name: PIE install smoke
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.4'
          tools: phpize, php-config
          coverage: none
      - name: Install PIE build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bison libtool-bin
      - name: Download PIE
        run: |
          curl -fsSL -o /tmp/pie.phar https://github.com/php/pie/releases/latest/download/pie.phar
          chmod +x /tmp/pie.phar
      - name: PIE build smoke
        run: |
          php /tmp/pie.phar repository:add path .
          php /tmp/pie.phar build iliaal/lchash:*@dev

  linux:
    name: PHP ${{ matrix.php }} - Linux NTS
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none

      - name: Build extension
        run: |
          phpize
          ./configure --enable-lchash
          make -j$(nproc)

      - name: Run test suite
        env:
          NO_INTERACTION: 1
        run: |
          export TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/lchash.so"
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/

  linux-zts:
    name: PHP ${{ matrix.php }} ZTS - Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    env:
      PHP_VERSION: ${{ matrix.php }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build deps
        run: sudo apt-get update -qq && sudo apt-get install -y re2c bison autoconf

      - name: Build PHP from source with --enable-zts
        run: |
          git clone --depth=1 --branch="PHP-${PHP_VERSION}" https://github.com/php/php-src.git /tmp/php-src
          cd /tmp/php-src
          ./buildconf --force
          ./configure --enable-zts --disable-all --enable-cli --prefix=/tmp/php-zts
          make -j$(nproc)
          make install

      - name: Build extension under ZTS
        run: |
          export PATH="/tmp/php-zts/bin:$PATH"
          phpize
          ./configure --enable-lchash --with-php-config=/tmp/php-zts/bin/php-config
          make -j$(nproc)

      - name: Run test suite under ZTS
        env:
          NO_INTERACTION: 1
        run: |
          export TEST_PHP_EXECUTABLE=/tmp/php-zts/bin/php
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/lchash.so"
          /tmp/php-zts/bin/php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/

  # Windows extension builds need the official PHP SDK + matching MSVC
  # toolset, not the autotools phpize/configure flow. The php-org
  # composite action below bundles SDK download, VS detection,
  # phpize / configure / nmake invocation, and a .dll smoke load.
  windows-matrix:
    name: Resolve Windows matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        uses: php/php-windows-builder/extension-matrix@e03e5d39879adaeb61ed2225f0f4eae7db8c1df8 # 1.8.1
        with:
          php-version-list: '8.3,8.4,8.5'

  windows:
    name: Windows ${{ matrix.php-version }} ${{ matrix.ts }} ${{ matrix.arch }}
    needs: windows-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.windows-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build extension
        uses: php/php-windows-builder/extension@e03e5d39879adaeb61ed2225f0f4eae7db8c1df8 # 1.8.1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          run-tests: 'true'

  # AddressSanitizer + UBSan against PHP built from source with
  # -fsanitize=address. Catches use-after-free, leaks, OOB across the
  # khash backend's allocator hooks and the OO class's per-instance
  # table lifecycle. Mirrors the php_clickhouse ASAN job, minus the
  # service container.
  asan:
    name: PHP ${{ matrix.php }} - ASAN
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    env:
      # detect_leaks=1 pinned explicitly. LSan's default is on under
      # Linux ASan; pinning prevents a future ASAN_OPTIONS edit from
      # silently flipping it. Narrow known-good leaks go in
      # .github/lsan-suppressions.txt; prefer that over blanket
      # detect_leaks=0. See ~/ai/wiki/debugging/asan-php-extension.md.
      ASAN_OPTIONS: exitcode=139:detect_odr_violation=0:detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt:print_suppressions=0
      UBSAN_OPTIONS: print_stacktrace=1
      USE_ZEND_ALLOC: 0
      PHP_VERSION: ${{ matrix.php }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y llvm clang re2c bison autoconf

      - name: Resolve clang runtime dir
        id: clang_rt
        run: echo "dir=$(clang -print-runtime-dir)" >> "$GITHUB_OUTPUT"

      - name: Build PHP with ASAN
        env:
          LD_LIBRARY_PATH: ${{ steps.clang_rt.outputs.dir }}
        run: |
          git clone --depth=1 --branch="PHP-${PHP_VERSION}" https://github.com/php/php-src.git /tmp/php-src
          cd /tmp/php-src
          ./buildconf --force
          # -shared-libasan: link ASan as a shared library so the dynamic
          # linker can resolve interceptors across the dlopen'd extension.
          CC=clang \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined -shared-libasan" \
          ./configure --enable-debug --disable-zts --disable-all --enable-cli --prefix=/tmp/php-asan
          make -j$(nproc)
          make install

      - name: Build extension with ASAN
        env:
          LD_LIBRARY_PATH: ${{ steps.clang_rt.outputs.dir }}
        run: |
          export PATH="/tmp/php-asan/bin:$PATH"
          phpize
          # Match PHP's exact -fsanitize set so the runtime ABI lines up.
          CC=clang \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined -shared-libasan" \
          ./configure --enable-lchash --with-php-config=/tmp/php-asan/bin/php-config
          make -j$(nproc)

      - name: Run tests under ASAN
        env:
          LD_LIBRARY_PATH: ${{ steps.clang_rt.outputs.dir }}
          NO_INTERACTION: 1
        run: |
          export TEST_PHP_EXECUTABLE=/tmp/php-asan/bin/php
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/lchash.so"
          /tmp/php-asan/bin/php run-tests.php --show-diff --asan -g FAIL,BORK,LEAK,XLEAK tests/

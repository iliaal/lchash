name: Release Windows binaries

# Runs when a GitHub Release is published. Builds every PHP version x arch x
# thread-safety variant on Windows and uploads each .dll with the PIE naming
# convention (php_lchash-<version>-<php_x.y>-<ts|nts>-vs17-<arch>.zip).
#
# Tests are off here because tests.yml already runs the same matrix on main.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-windows-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Resolve Windows release matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        uses: php/php-windows-builder/extension-matrix@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version-list: '8.3, 8.4, 8.5'

  build:
    name: Build ${{ matrix.php-version }} ${{ matrix.ts }} ${{ matrix.arch }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          run-tests: 'false'

  release:
    name: Upload binaries to the release
    runs-on: ubuntu-latest
    needs: build
    # GITHUB_TOKEN is read-only for contents on newer repos. Without write
    # access, `gh release upload` fails with HTTP 403 "Resource not
    # accessible by integration".
    permissions:
      contents: write # Uploads Windows binaries to the published release.
    steps:
      - uses: php/php-windows-builder/release@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          release: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
